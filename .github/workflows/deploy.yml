name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            set -e

            # Create deploy directory
            mkdir -p /opt/yogduoj

            # Clone or update repo
            if [ -d /opt/yogduoj/.git ]; then
              cd /opt/yogduoj
              git fetch origin
              git reset --hard origin/main
            else
              git clone https://github.com/Yogdunana/yogduoj.git /opt/yogduoj
              cd /opt/yogduoj
            fi

            # Write .env if not exists
            if [ ! -f .env ]; then
              cat > .env << 'ENV_EOF'
            MYSQL_ROOT_PASSWORD=YogduOJ2026Secure!
            DB_HOST=mysql
            DB_PORT=3306
            DB_USER=root
            DB_PASSWORD=YogduOJ2026Secure!
            DB_NAME=yogduoj
            JWT_SECRET=yogduoj_jwt_secret_key_change_in_production_2026
            JWT_ACCESS_TTL=2h
            JWT_REFRESH_TTL=168h
            SERVER_PORT=8080
            GIN_MODE=release
            JUDGE_GRPC_ADDR=judge:50051
            JUDGE_POOL_SIZE=4
            APP_NAME=YogduOJ
            APP_URL=https://oj.yogdunana.com
            ENV_EOF
              echo "Created .env file"
            fi

            # Write docker-compose.yml
            cat > docker-compose.yml << 'COMPOSE_EOF'
            services:
              mysql:
                image: mysql:8.0
                container_name: yogduoj-mysql
                restart: always
                environment:
                  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
                  MYSQL_DATABASE: yogduoj
                volumes:
                  - mysql_data:/var/lib/mysql
                ports:
                  - "127.0.0.1:3306:3306"
                networks:
                  - yogduoj-net
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              backend:
                build: ./backend
                container_name: yogduoj-backend
                restart: always
                env_file: .env
                depends_on:
                  mysql:
                    condition: service_healthy
                volumes:
                  - submission_data:/data/submissions
                  - problem_data:/data/problems
                ports:
                  - "127.0.0.1:8080:8080"
                networks:
                  - yogduoj-net

              judge:
                build: ./judge
                container_name: yogduoj-judge
                restart: always
                privileged: true
                env_file: .env
                depends_on:
                  - backend
                volumes:
                  - submission_data:/data/submissions:ro
                  - problem_data:/data/problems:ro
                ports:
                  - "127.0.0.1:50051:50051"
                networks:
                  - yogduoj-net

              frontend:
                build: ./frontend
                container_name: yogduoj-frontend
                restart: always
                ports:
                  - "127.0.0.1:3000:80"
                networks:
                  - yogduoj-net

              nginx:
                image: nginx:alpine
                container_name: yogduoj-nginx
                restart: always
                ports:
                  - "23196:80"
                volumes:
                  - ./deploy/nginx/conf.d/yogduoj.conf:/etc/nginx/conf.d/default.conf:ro
                depends_on:
                  - frontend
                  - backend
                networks:
                  - yogduoj-net

            volumes:
              mysql_data:
              submission_data:
              problem_data:

            networks:
              yogduoj-net:
                driver: bridge
            COMPOSE_EOF

            # Write nginx config
            mkdir -p deploy/nginx/conf.d
            cat > deploy/nginx/conf.d/yogduoj.conf << 'NGINX_EOF'
            server {
                listen 80;
                server_name oj.yogdunana.com _;

                client_max_body_size 50M;

                location / {
                    proxy_pass http://frontend:80;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location /api/ {
                    proxy_pass http://backend:8080;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location ~ ^/api/v1/submissions/\d+/judge$ {
                    proxy_pass http://backend:8080;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_read_timeout 300s;
                }
            }
            NGINX_EOF

            # Stop existing containers
            docker compose down 2>/dev/null || true

            # Build and start
            echo "=== Building images ==="
            docker compose build --parallel

            echo "=== Starting services ==="
            docker compose up -d

            # Wait for services
            echo "=== Waiting for services ==="
            sleep 30

            # Health check
            echo "=== Health Check ==="
            curl -sf http://localhost:8080/api/v1/health && echo "Backend: OK" || echo "Backend: FAILED"
            curl -sf http://localhost:23196/ -o /dev/null -w "Frontend: HTTP %{http_code}\n" || echo "Frontend: FAILED"

            echo "=== Container Status ==="
            docker compose ps
