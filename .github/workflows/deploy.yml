name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.PAT_TOKEN }}" | docker login ghcr.io -u Yogdunana --password-stdin

      - name: Build and push backend
        run: |
          docker build -t ghcr.io/yogdunana/yogduoj-backend:latest ./backend
          docker push ghcr.io/yogdunana/yogduoj-backend:latest

      - name: Build and push frontend
        run: |
          docker build -t ghcr.io/yogdunana/yogduoj-frontend:latest ./frontend
          docker push ghcr.io/yogdunana/yogduoj-frontend:latest

      - name: Build and push judge
        run: |
          docker build -t ghcr.io/yogdunana/yogduoj-judge:latest ./judge
          docker push ghcr.io/yogdunana/yogduoj-judge:latest

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            # Create deploy directory if not exists
            mkdir -p /opt/yogduoj/deploy/nginx/conf.d
            mkdir -p /opt/yogduoj/deploy/mysql
            mkdir -p /opt/yogduoj/deploy/scripts

            # Write docker-compose.yml
            cat > /opt/yogduoj/docker-compose.yml << 'COMPOSE_EOF'
            version: '3.8'

            services:
              mysql:
                image: mysql:8.0
                container_name: yogduoj-mysql
                restart: always
                environment:
                  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
                  MYSQL_DATABASE: yogduoj
                volumes:
                  - mysql_data:/var/lib/mysql
                ports:
                  - "127.0.0.1:3306:3306"
                networks:
                  - yogduoj-net
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              backend:
                image: ghcr.io/yogdunana/yogduoj-backend:latest
                container_name: yogduoj-backend
                restart: always
                env_file: .env
                depends_on:
                  mysql:
                    condition: service_healthy
                volumes:
                  - submission_data:/data/submissions
                  - problem_data:/data/problems
                ports:
                  - "127.0.0.1:8080:8080"
                networks:
                  - yogduoj-net

              judge:
                image: ghcr.io/yogdunana/yogduoj-judge:latest
                container_name: yogduoj-judge
                restart: always
                privileged: true
                env_file: .env
                depends_on:
                  - backend
                volumes:
                  - submission_data:/data/submissions:ro
                  - problem_data:/data/problems:ro
                ports:
                  - "127.0.0.1:50051:50051"
                networks:
                  - yogduoj-net

              frontend:
                image: ghcr.io/yogdunana/yogduoj-frontend:latest
                container_name: yogduoj-frontend
                restart: always
                ports:
                  - "127.0.0.1:3000:80"
                networks:
                  - yogduoj-net

              nginx:
                image: nginx:alpine
                container_name: yogduoj-nginx
                restart: always
                ports:
                  - "23196:80"
                volumes:
                  - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
                depends_on:
                  - frontend
                  - backend
                networks:
                  - yogduoj-net

            volumes:
              mysql_data:
              submission_data:
              problem_data:

            networks:
              yogduoj-net:
                driver: bridge
            COMPOSE_EOF

            # Write .env if not exists
            if [ ! -f /opt/yogduoj/.env ]; then
              cat > /opt/yogduoj/.env << 'ENV_EOF'
            MYSQL_ROOT_PASSWORD=YogduOJ2026Secure!
            DB_HOST=mysql
            DB_PORT=3306
            DB_USER=root
            DB_PASSWORD=YogduOJ2026Secure!
            DB_NAME=yogduoj
            JWT_SECRET=yogduoj_jwt_secret_key_change_in_production_2026
            JWT_ACCESS_TTL=2h
            JWT_REFRESH_TTL=168h
            SERVER_PORT=8080
            GIN_MODE=release
            JUDGE_GRPC_ADDR=judge:50051
            JUDGE_POOL_SIZE=4
            APP_NAME=YogduOJ
            APP_URL=https://oj.yogdunana.com
            ENV_EOF
              echo "Created .env file"
            fi

            # Write nginx config
            cat > /opt/yogduoj/nginx.conf << 'NGINX_EOF'
            server {
                listen 80;
                server_name oj.yogdunana.com _;

                client_max_body_size 50M;

                location / {
                    proxy_pass http://frontend:80;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location /api/ {
                    proxy_pass http://backend:8080;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location ~ ^/api/v1/submissions/\d+/judge$ {
                    proxy_pass http://backend:8080;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_read_timeout 300s;
                }
            }
            NGINX_EOF

            # Login to GHCR and pull images
            echo "${{ secrets.PAT_TOKEN }}" | docker login ghcr.io -u Yogdunana --password-stdin 2>/dev/null

            cd /opt/yogduoj
            docker compose pull
            docker compose up -d
            docker image prune -f

            # Wait for services to start
            sleep 15

            # Health check
            echo "=== Health Check ==="
            curl -sf http://localhost:8080/api/v1/health || echo "Backend health check failed"
            curl -sf http://localhost:23196/ -o /dev/null -w "Frontend HTTP status: %{http_code}\n" || echo "Frontend check failed"

            echo "=== Docker Status ==="
            docker compose ps
