name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            set -e

            # Create deploy directory
            mkdir -p /opt/yogduoj

            # Clone or update repo
            if [ -d /opt/yogduoj/.git ]; then
              cd /opt/yogduoj
              git fetch origin
              git reset --hard origin/main
            else
              rm -rf /opt/yogduoj
              git clone https://github.com/Yogdunana/yogduoj.git /opt/yogduoj
              cd /opt/yogduoj
            fi

            # Write .env if not exists
            if [ ! -f /opt/yogduoj/.env ]; then
              cat > /opt/yogduoj/.env << 'ENV_EOF'
            MYSQL_ROOT_PASSWORD=YogduOJ2026Secure!
            DB_HOST=mysql
            DB_PORT=3306
            DB_USER=root
            DB_PASSWORD=YogduOJ2026Secure!
            DB_NAME=yogduoj
            JWT_SECRET=yogduoj_jwt_secret_key_change_in_production_2026
            JWT_ACCESS_TTL=2h
            JWT_REFRESH_TTL=168h
            SERVER_PORT=8080
            GIN_MODE=release
            JUDGE_GRPC_ADDR=judge:50051
            JUDGE_POOL_SIZE=4
            APP_NAME=YogduOJ
            APP_URL=https://oj.yogdunana.com
            ENV_EOF
              echo "Created .env file"
            fi

            # Write docker-compose.yml
            cat > /opt/yogduoj/docker-compose.yml << 'COMPOSE_EOF'
            services:
              mysql:
                image: mysql:8.0
                container_name: yogduoj-mysql
                restart: always
                environment:
                  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
                  MYSQL_DATABASE: yogduoj
                volumes:
                  - mysql_data:/var/lib/mysql
                networks:
                  - yogduoj-net
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              backend:
                build: ./backend
                container_name: yogduoj-backend
                restart: always
                env_file: .env
                depends_on:
                  mysql:
                    condition: service_healthy
                volumes:
                  - submission_data:/data/submissions
                  - problem_data:/data/problems
                ports:
                  - "127.0.0.1:8081:8080"
                networks:
                  - yogduoj-net

              frontend:
                build: ./frontend
                container_name: yogduoj-frontend
                restart: always
                ports:
                  - "127.0.0.1:3000:80"
                networks:
                  - yogduoj-net

              nginx:
                image: nginx:alpine
                container_name: yogduoj-nginx
                restart: always
                ports:
                  - "127.0.0.1:23197:80"
                volumes:
                  - /opt/yogduoj/deploy/nginx/conf.d/yogduoj.conf:/etc/nginx/conf.d/default.conf:ro
                depends_on:
                  - frontend
                  - backend
                networks:
                  - yogduoj-net

            volumes:
              mysql_data:
              submission_data:
              problem_data:

            networks:
              yogduoj-net:
                driver: bridge
            COMPOSE_EOF

            # Write container nginx config (internal routing)
            mkdir -p /opt/yogduoj/deploy/nginx/conf.d
            cat > /opt/yogduoj/deploy/nginx/conf.d/yogduoj.conf << 'NGINX_EOF'
            server {
                listen 80;
                server_name oj.yogdunana.com _;

                client_max_body_size 50M;

                location / {
                    proxy_pass http://frontend:80;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location /api/ {
                    proxy_pass http://backend:8080;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location ~ ^/api/v1/submissions/\d+/judge$ {
                    proxy_pass http://backend:8080;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_read_timeout 300s;
                }
            }
            NGINX_EOF

            # Stop existing containers
            cd /opt/yogduoj
            docker compose down --remove-orphans --timeout 10 2>/dev/null || true
            sleep 3

            # Clean up port conflicts
            for port in 8081 23197 3000; do
              pids=$(ss -tlnp "sport = :${port}" 2>/dev/null | grep -oP 'pid=\K[0-9]+' || true)
              if [ -n "$pids" ]; then
                for pid in $pids; do
                  kill -9 "$pid" 2>/dev/null || true
                done
                sleep 2
              fi
            done

            # Build images (always rebuild backend since config.go changed)
            echo "=== Building images ==="
            docker compose build --no-cache backend
            docker compose build frontend

            # Start services
            echo "=== Starting services ==="
            docker compose up -d

            # Wait for backend to be ready
            echo "=== Waiting for services ==="
            sleep 15

            # Configure host nginx reverse proxy for oj.yogdunana.com
            echo "=== Configuring host nginx ==="
            cat > /etc/nginx/sites-available/oj.yogdunana.com << 'HOST_NGINX_EOF'
            # YogduOJ - Online Judge System
            # 安装位置: /etc/nginx/sites-available/oj.yogdunana.com
            # 启用方式: ln -s /etc/nginx/sites-available/oj.yogdunana.com /etc/nginx/sites-enabled/

            # HTTP -> HTTPS redirect
            server {
                listen 80;
                listen [::]:80;
                server_name oj.yogdunana.com;

                # Allow certbot challenges
                location /.well-known/acme-challenge/ {
                    root /var/www/certbot;
                }

                location / {
                    return 301 https://$host$request_uri;
                }
            }

            # HTTPS
            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name oj.yogdunana.com;

                ssl_certificate /etc/letsencrypt/live/oj.yogdunana.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/oj.yogdunana.com/privkey.pem;
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers HIGH:!aNULL:!MD5;
                ssl_prefer_server_ciphers on;

                client_max_body_size 50M;

                location / {
                    proxy_pass http://127.0.0.1:23197;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_connect_timeout 10s;
                    proxy_read_timeout 300s;
                    proxy_send_timeout 300s;
                }

                # WebSocket support for judge
                location ~ ^/api/v1/submissions/\d+/judge$ {
                    proxy_pass http://127.0.0.1:23197;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_read_timeout 300s;
                }

                access_log /var/log/nginx/oj_yogdunana_access.log;
                error_log /var/log/nginx/oj_yogdunana_error.log;
            }
            HOST_NGINX_EOF

            # Enable site and handle SSL
            ln -sf /etc/nginx/sites-available/oj.yogdunana.com /etc/nginx/sites-enabled/oj.yogdunana.com

            # Check if SSL cert exists, if not use temporary self-signed or HTTP only
            if [ -f /etc/letsencrypt/live/oj.yogdunana.com/fullchain.pem ]; then
              echo "SSL certificate exists, using HTTPS config"
            else
              echo "No SSL certificate found. Installing self-signed cert for now..."
              mkdir -p /etc/letsencrypt/live/oj.yogdunana.com
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout /etc/letsencrypt/live/oj.yogdunana.com/privkey.pem \
                -out /etc/letsencrypt/live/oj.yogdunana.com/fullchain.pem \
                -subj "/CN=oj.yogdunana.com" 2>/dev/null || true
              echo "Self-signed cert installed. Replace with Let's Encrypt later."
            fi

            # Test and start host nginx
            nginx -t 2>&1
            if [ -f /run/nginx.pid ] && [ -s /run/nginx.pid ]; then
              nginx -s reload 2>/dev/null || true
            else
              systemctl start nginx 2>/dev/null || nginx 2>/dev/null || true
              sleep 2
            fi
            echo "--- Host nginx ports ---"
            ss -tlnp | grep -E ':(80|443)\b' || echo "Nothing on 80/443"

            # Wait a bit more for services to stabilize
            sleep 15

            # Health check
            echo "=== Health Check ==="
            curl -sf http://localhost:8081/api/v1/health && echo "Backend: OK" || echo "Backend: FAILED"
            curl -sf http://localhost:23197/ -o /dev/null -w "Frontend: HTTP %{http_code}\n" || echo "Frontend: FAILED"
            curl -sf -H "Host: oj.yogdunana.com" https://localhost/ -o /dev/null -w "Via host nginx: HTTP %{http_code}\n" --insecure || echo "Host nginx: FAILED"

            echo "=== Container Status ==="
            docker compose ps

            echo "=== Deployment Complete ==="
