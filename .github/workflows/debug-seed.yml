name: Debug Seed
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check seed data
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 3m
          script: |
            echo "=== Backend Seed Logs ==="
            docker logs yogduoj-backend 2>&1 | grep -E "(Seed|seed|Error|error|Created|Migration)" | head -20
            echo "=== DB Counts ==="
            docker exec yogduoj-mysql mysql -uroot -pYogduOJ2026Secure! yogduoj -e "SELECT 'users' as t, COUNT(*) as c FROM users UNION ALL SELECT 'problems', COUNT(*) FROM problems UNION ALL SELECT 'contests', COUNT(*) FROM contests UNION ALL SELECT 'announcements', COUNT(*) FROM announcements UNION ALL SELECT 'tags', COUNT(*) FROM tags UNION ALL SELECT 'submissions', COUNT(*) FROM submissions;" 2>&1
