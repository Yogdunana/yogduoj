name: Fix Other Sites
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix cap.yogdunana.com
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 15m
          script: |
            echo "=== Investigating cap.yogdunana.com ==="

            # Find cap project files
            echo "--- Find cap project ---"
            find / -maxdepth 4 -name "*.py" -path "*cap*" 2>/dev/null | head -10
            find / -maxdepth 4 -name "manage.py" 2>/dev/null | head -5
            find / -maxdepth 4 -name "requirements.txt" -path "*cap*" 2>/dev/null | head -5
            find / -maxdepth 4 -name "Dockerfile" -path "*cap*" 2>/dev/null | head -5
            find / -maxdepth 4 -type d -name "*cap*" 2>/dev/null | head -10

            # Check PM2 ecosystem/config
            echo "--- PM2 config ---"
            cat /root/ecosystem.config.js 2>/dev/null || echo "No ecosystem.config.js"
            pm2 show cap 2>/dev/null || echo "No PM2 app named cap"
            pm2 show calorie 2>/dev/null || echo "No PM2 app named calorie"
            pm2 prettylist 2>/dev/null | grep -A5 -E '(name|port|cwd|script|pm_exec_path)' | head -40

            # Check Docker history for cap containers
            echo "--- Docker stopped containers ---"
            docker ps -a --filter "name=cap" --format "{{.Names}} {{.Status}} {{.Image}}" 2>/dev/null
            docker ps -a --format "{{.Names}} {{.Status}} {{.Image}}" 2>/dev/null | grep -v yogduoj

            # Check nginx config for cap
            echo "--- Cap nginx config ---"
            cat /etc/nginx/sites-available/cap.yogdunana.com 2>/dev/null

            # Check if port 8000 was used by a Docker container before
            echo "--- Docker images with port 8000 ---"
            docker images --format "{{.Repository}}:{{.Tag}}" 2>/dev/null | grep -v yogduoj

            # Check for any Python/Django/Flask processes
            echo "--- Python processes ---"
            ps aux | grep -E '(python|gunicorn|uvicorn|flask|django)' | grep -v grep || echo "No Python processes"

            # Check bash history for clues
            echo "--- Recent bash history ---"
            grep -E '(cap|8000|docker run)' ~/.bash_history 2>/dev/null | tail -20 || echo "No bash history"
