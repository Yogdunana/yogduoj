name: Fix Other Sites
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deep investigate cap
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 15m
          script: |
            echo "=== Deep investigation for cap.yogdunana.com ==="

            # Search entire filesystem for cap-related project files
            echo "--- Searching for cap project files ---"
            find / -maxdepth 5 -type d -iname "*cap*" 2>/dev/null | grep -v proc | grep -v sys | grep -v lib | grep -v share | grep -v doc | grep -v cache
            find / -maxdepth 5 -name "docker-compose*" 2>/dev/null | grep -v yogduoj | grep -v proc
            find / -maxdepth 5 -name "*.env" 2>/dev/null | grep -v yogduoj | grep -v proc | grep -v snap

            # Check all Docker images ever built
            echo "--- All Docker images ---"
            docker images -a --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}\t{{.CreatedAt}}" 2>/dev/null

            # Check all Docker volumes
            echo "--- Docker volumes ---"
            docker volume ls 2>/dev/null

            # Check all Docker networks
            echo "--- Docker networks ---"
            docker network ls 2>/dev/null

            # Check if there's a cap-related Docker image in history
            echo "--- Docker image history ---"
            docker images -a --format "{{.Repository}}:{{.Tag}}" | grep -iv yogduoj | grep -iv nginx | grep -iv mysql

            # Check root home directory
            echo "--- Root home ---"
            ls -la /root/ 2>/dev/null

            # Check for any startup scripts
            echo "--- Startup scripts ---"
            cat /etc/rc.local 2>/dev/null || echo "No rc.local"
            ls /etc/init.d/ 2>/dev/null | grep -v yogduoj | head -20

            # Check crontab
            echo "--- Crontab ---"
            crontab -l 2>/dev/null || echo "No crontab"

            # Check PM2 dump
            echo "--- PM2 dump ---"
            cat /root/.pm2/dump.pm2 2>/dev/null | python3 -m json.tool 2>/dev/null | head -60 || echo "No PM2 dump"

            # Check for any cap-related files in common web directories
            echo "--- Common web directories ---"
            ls -la /var/www/ 2>/dev/null
            ls -la /srv/ 2>/dev/null

            # Check Docker container removal history
            echo "--- Docker events for cap ---"
            journalctl -u docker --since "24 hours ago" --no-pager 2>/dev/null | grep -i "cap" | tail -20

            # Check for any Python virtual environments
            echo "--- Python venvs ---"
            find / -maxdepth 4 -name "activate" -path "*/bin/activate" 2>/dev/null | grep -v proc | grep -v sys | head -10

            # Check for any running or recently stopped processes related to port 8000
            echo "--- Port 8000 history ---"
            journalctl --since "24 hours ago" --no-pager 2>/dev/null | grep 8000 | tail -10
