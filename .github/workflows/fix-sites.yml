name: Fix Other Sites
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore other sites
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 15m
          script: |
            echo "=========================================="
            echo "=== DETAILED INVESTIGATION ==="
            echo "=========================================="

            # 1. Check for docker-compose files for other sites
            echo "=== Docker Compose Files ==="
            find /opt -name "docker-compose.yml" -o -name "docker-compose.yaml" 2>/dev/null
            find /root -name "docker-compose.yml" -o -name "docker-compose.yaml" 2>/dev/null
            find /home -name "docker-compose.yml" -o -name "docker-compose.yaml" 2>/dev/null

            # 2. Check ALL docker containers (including stopped ones)
            echo "=== All Docker Containers (including stopped) ==="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}" 2>/dev/null

            # 3. Check systemd services related to web apps
            echo "=== Systemd Web Services ==="
            systemctl list-units --type=service --state=running 2>/dev/null | grep -iE '(cap|calorie|referral|maixuan|node|python|gunicorn|uvicorn|flask|django|next|nuxt|vite)' || echo "No matching systemd services"

            # 4. Check for PM2 processes
            echo "=== PM2 Processes ==="
            pm2 list 2>/dev/null || echo "PM2 not installed"

            # 5. Check what's supposed to be on ports 3001, 3002, 8000
            echo "=== Port Status ==="
            for port in 3001 3002 8000; do
              echo "Port $port:"
              ss -tlnp "sport = :${port}" 2>/dev/null || echo "  (nothing listening)"
            done

            # 6. Check for screen/tmux sessions
            echo "=== Screen/Tmux Sessions ==="
            screen -ls 2>/dev/null || echo "No screen sessions"
            tmux list-sessions 2>/dev/null || echo "No tmux sessions"

            # 7. Check /opt directories for other projects
            echo "=== /opt Contents ==="
            ls -la /opt/ 2>/dev/null

            # 8. Check for any process that was running before (journalctl)
            echo "=== Recent Docker Events ==="
            journalctl -u docker --since "6 hours ago" --no-pager 2>/dev/null | grep -E "(cap|calorie|referral|maixuan|die|kill|stop|start)" | tail -20 || echo "No journalctl access"

            # 9. Check docker images for other sites
            echo "=== Docker Images (non-yogduoj) ==="
            docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedAt}}" 2>/dev/null | grep -v yogduoj | head -20

            # 10. Check for supervisord
            echo "=== Supervisor ==="
            supervisorctl status 2>/dev/null || echo "No supervisord"
