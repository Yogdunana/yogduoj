name: Fix Calorie Backend v2
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Calorie Backend
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            echo "=== Install backend deps in correct directory ==="
            cd /opt/calorie-battle/calorie-battle-server
            npm install 2>&1 | tail -5
            
            echo "=== Restart PM2 ==="
            pm2 delete calorie-battle 2>/dev/null
            pm2 start server.js --name calorie-battle 2>&1
            sleep 5
            
            echo "=== PM2 Status ==="
            pm2 list 2>&1
            
            echo "=== Health Check ==="
            curl -sf http://localhost:3001/api/health 2>&1 && echo "Calorie Backend: OK" || curl -sf http://localhost:3001/ 2>&1 | head -3 || echo "Calorie Backend: FAILED"
