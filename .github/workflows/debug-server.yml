name: Fix CAP v4
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CAP
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            echo "=== Find CAP project structure ==="
            find /opt/ai-captcha -name "Dockerfile" -o -name "requirements.txt" -o -name "docker-compose*" 2>/dev/null
            
            echo "=== Check deploy dir ==="
            ls -la /opt/ai-captcha/deploy/ 2>&1
            
            echo "=== Check docker-compose.prod.yml ==="
            cat /opt/ai-captcha/deploy/docker-compose.prod.yml 2>&1
            
            echo "=== Check if Dockerfile is in deploy/ ==="
            ls -la /opt/ai-captcha/deploy/Dockerfile 2>&1
            
            echo "=== Check backend dir ==="
            ls -la /opt/ai-captcha/backend/ 2>&1 | head -10
            ls -la /opt/ai-captcha/backend/Dockerfile 2>&1
            ls -la /opt/ai-captcha/backend/requirements.txt 2>&1
            
            echo "=== Check .env in deploy ==="
            ls -la /opt/ai-captcha/deploy/.env 2>&1
