name: Fix Calorie Backend
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Calorie Backend
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            echo "=== PM2 Error Logs ==="
            pm2 logs calorie-battle --lines 20 --err --nostream 2>&1
            
            echo "=== Check server.js location ==="
            find /opt/calorie-battle -name "server.js" -maxdepth 2 2>/dev/null
            ls -la /opt/calorie-battle/calorie-battle-server/server.js 2>&1
            
            echo "=== Restart with correct path ==="
            cd /opt/calorie-battle/calorie-battle-server
            pm2 delete calorie-battle 2>/dev/null
            pm2 start server.js --name calorie-battle 2>&1
            sleep 5
            
            echo "=== PM2 Status ==="
            pm2 list 2>&1
            
            echo "=== Health Check ==="
            curl -sf http://localhost:3001/api/health 2>&1 && echo "Calorie Backend: OK" || echo "Calorie Backend: FAILED"
