name: Fix CAP and Referral
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CAP and Referral
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            echo "=========================================="
            echo "=== 1. FIX AI-CAPTCHA ==="
            echo "=========================================="
            # Check for .env files
            echo "--- Looking for .env files ---"
            find /opt/ai-captcha -name ".env*" -type f 2>/dev/null
            echo ""
            echo "--- Check deploy directory ---"
            ls -la /opt/ai-captcha/deploy/ 2>&1
            echo ""
            echo "--- Check docker-compose.prod.yml content ---"
            cat /opt/ai-captcha/deploy/docker-compose.prod.yml 2>&1 | head -40
            echo ""
            echo "--- Try docker compose with explicit env ---"
            cd /opt/ai-captcha/deploy
            # Check if .env.example exists
            if [ -f ".env.example" ]; then
              echo "--- .env.example found ---"
              cat .env.example
            fi

            echo "=========================================="
            echo "=== 2. FIX REFERRAL ==="
            echo "=========================================="
            echo "--- Check PM2 logs ---"
            pm2 logs yogdu-referral --lines 20 --nostream 2>&1
            echo ""
            echo "--- Check what's on port 3002 ---"
            ss -tlnp | grep 3002
            echo ""
            echo "--- Check referral project ---"
            ls -la /opt/yogdu-referral/ 2>&1 | head -20
            echo ""
            echo "--- Check start.sh ---"
            cat /opt/yogdu-referral/start.sh 2>&1
            echo ""
            echo "--- Check .env ---"
            cat /opt/yogdu-referral/.env 2>&1 | head -10
            echo ""
            echo "--- Test port 3002 ---"
            curl -sv http://localhost:3002/ 2>&1 | head -20
