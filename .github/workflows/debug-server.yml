name: Fix Server
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restart OJ containers and fix issues
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            echo "=== 1. Check Docker Compose Project ==="
            cd /opt/yogduoj 2>/dev/null || cd /root/yogduoj 2>/dev/null || cd /home/yogduoj 2>/dev/null
            find / -name "docker-compose.yml" -path "*/yogduoj/*" 2>/dev/null | head -5
            COMPOSE_DIR=$(find / -name "docker-compose.yml" -path "*/yogduoj/*" 2>/dev/null | head -1 | xargs dirname)
            echo "Compose dir: $COMPOSE_DIR"

            echo "=== 2. Restart All Containers ==="
            cd "$COMPOSE_DIR" && docker compose up -d 2>&1

            echo "=== 3. Wait and Check ==="
            sleep 15
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>&1

            echo "=== 4. Check calorie site config ==="
            cat /etc/nginx/sites-enabled/calorie-battle 2>/dev/null || echo "Not found in sites-enabled"
            find /etc/nginx -name "*calorie*" 2>/dev/null

            echo "=== 5. Check all site configs ==="
            for f in /etc/nginx/sites-enabled/*; do echo "--- $f ---"; head -30 "$f" 2>/dev/null; done

            echo "=== 6. Health Check ==="
            curl -sf http://localhost:8081/api/v1/health && echo "Backend: OK" || echo "Backend: FAILED"
            curl -sf http://localhost:23197/ -o /dev/null -w "Frontend: HTTP %{http_code}\n" || echo "Frontend: FAILED"
