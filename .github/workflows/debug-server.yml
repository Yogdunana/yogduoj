name: Debug Server
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug server
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 3m
          script: |
            echo "=== Nginx Status ==="
            systemctl status nginx --no-pager -l 2>&1 | head -20

            echo "=== Nginx Config Test ==="
            nginx -t 2>&1

            echo "=== All Nginx Sites ==="
            ls /etc/nginx/sites-enabled/ 2>/dev/null || ls /etc/nginx/conf.d/ 2>/dev/null

            echo "=== Docker Containers ==="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>&1

            echo "=== Listening Ports ==="
            ss -tlnp | grep -E ':(80|443|8080|8081|23196|23197)\b' 2>&1

            echo "=== Disk Space ==="
            df -h / 2>&1

            echo "=== Memory ==="
            free -h 2>&1

            echo "=== Recent Nginx Errors ==="
            tail -20 /var/log/nginx/error.log 2>/dev/null || echo "No error log"
            for f in /var/log/nginx/*error*.log; do echo "--- $f ---"; tail -5 "$f" 2>/dev/null; done
