name: Fix CAP v5
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CAP
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 15m
          script: |
            cd /opt/ai-captcha/deploy

            echo "=== Pulling latest code ==="
            cd /opt/ai-captcha && git pull 2>&1 | tail -3

            echo "=== Building Docker image (with retry) ==="
            cd /opt/ai-captcha/deploy
            
            # Try building with pip timeout and retry
            export DOCKER_BUILDKIT=1
            docker compose -f docker-compose.prod.yml build --no-cache 2>&1 | tail -30
            BUILD_EXIT=$?
            
            if [ $BUILD_EXIT -ne 0 ]; then
              echo "=== First build failed, retrying with pip mirror ==="
              # Try with Chinese pip mirror
              cd /opt/ai-captcha/server
              # Temporarily modify Dockerfile to use tsinghua mirror
              sed -i 's|pip install --no-cache-dir --break-system-packages -r requirements.txt|pip install --no-cache-dir --break-system-packages -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt|' Dockerfile
              cd /opt/ai-captcha/deploy
              docker compose -f docker-compose.prod.yml build --no-cache 2>&1 | tail -30
              BUILD_EXIT=$?
              # Restore original Dockerfile
              cd /opt/ai-captcha && git checkout server/Dockerfile
            fi
            
            if [ $BUILD_EXIT -eq 0 ]; then
              echo "=== Build succeeded, starting containers ==="
              cd /opt/ai-captcha/deploy
              docker compose -f docker-compose.prod.yml up -d 2>&1 | tail -10
              sleep 10
              
              echo "=== Port check ==="
              ss -tlnp | grep 8000 2>&1
              
              echo "=== Health check ==="
              curl -sf http://localhost:8000/health 2>&1 || curl -sf http://localhost:8000/ 2>&1 | head -5 || echo "CAP: not responding"
            else
              echo "=== Build failed after retry ==="
              echo "=== Trying to build with verbose output ==="
              cd /opt/ai-captcha/deploy
              docker compose -f docker-compose.prod.yml build 2>&1 | grep -E "(error|Error|ERROR|FAIL|Could not|no matching|exit)" | tail -20
            fi
