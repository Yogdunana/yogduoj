name: Fix CAP and Referral v2
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CAP and Referral
        uses: appleboy/ssh-action@v1
        with:
          host: 101.237.129.33
          port: 23196
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            echo "=========================================="
            echo "=== 1. FIX AI-CAPTCHA ==="
            echo "=========================================="
            # Copy .env to deploy directory
            cp /opt/ai-captcha/.env /opt/ai-captcha/deploy/.env
            echo "Copied .env to deploy directory"
            
            # Start docker compose
            cd /opt/ai-captcha/deploy && docker compose -f docker-compose.prod.yml up -d 2>&1 | tail -15
            
            echo "Waiting for containers..."
            sleep 10
            
            echo "--- Docker Containers ---"
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>&1
            
            echo "--- Port 8000 check ---"
            ss -tlnp | grep 8000 2>&1
            
            echo "--- Health check ---"
            curl -sf http://localhost:8000/ 2>&1 | head -5 || echo "CAP: not responding yet"

            echo "=========================================="
            echo "=== 2. FIX REFERRAL ==="
            echo "=========================================="
            # Check if PostgreSQL is running on port 5433
            echo "--- PostgreSQL check ---"
            ss -tlnp | grep 5433 2>&1
            docker ps -a --format "{{.Names}}\t{{.Status}}" | grep -i postgres 2>&1
            
            # Check PM2 error logs
            echo "--- PM2 Error Logs ---"
            pm2 logs yogdu-referral --lines 30 --err --nostream 2>&1
            
            # Restart referral
            echo "--- Restarting referral ---"
            cd /opt/yogdu-referral && pm2 restart yogdu-referral 2>&1
            sleep 5
            
            echo "--- Test again ---"
            curl -sf http://localhost:3002/ 2>&1 | head -5 || echo "Referral: still failing"
