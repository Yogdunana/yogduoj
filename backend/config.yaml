server:
  port: 8080
  mode: debug

database:
  host: localhost
  port: 3306
  user: root
  password: ""
  dbname: yogduoj
  charset: utf8mb4
  parse_time: true
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

jwt:
  secret: "yogduoj-default-secret-change-in-production"
  access_ttl: 2h
  refresh_ttl: 168h

rate_limit:
  requests_per_minute: 60
  burst: 100

log:
  level: debug
  file_path: logs/app.log
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true
